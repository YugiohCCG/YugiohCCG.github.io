name: CCG QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install Node dependencies
        run: npm ci

      - name: Validate database prerequisites
        run: |
          python scripts/test_official_omega_reference.py
          python scripts/validate_qa_databases.py

      - name: Test Lua parser call forms
        run: node scripts/test_lua_call_arguments.cjs

      - name: Test revised Ohmen mechanics
        run: lua scripts/test_ohmen_requested_revision.lua .

      - name: Test Ohmen scripts in the duel engine
        run: |
          python scripts/prepare_ohmen_engine_tests.py --download
          python scripts/run_ohmen_engine_regressions.py ci
          node --no-warnings scripts/test_ohmen_engine_probes.cjs

      - name: Run CCG QA
        run: npm run qa:ccg:ci
