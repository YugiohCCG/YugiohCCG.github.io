name: CCG QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install Node dependencies
        run: npm ci

      - name: Run CCG QA
        run: npm run qa:ccg:ci
